   ![存储库标头的屏幕截图，其中显示了选项卡。 “设置”选项卡以深橙色边框突出显示。](/assets/images/help/repository/repo-actions-settings.png)

3. 在“常规”设置页的“功能”部分，选择“赞助”。

4. 在“赞助”框中，单击“设置赞助者按钮”或“替代资助链接” 。

5. 在文件编辑器中，按照 `FUNDING.yml` 文件中的说明将链接添加到你的资助位置。

6. 单击“提交更改...”

7. 在“提交消息”字段中，输入简短、有意义的提交消息，以描述对文件的更改。 您可以在提交消息中将提交归于多个作者。 有关详细信息，请参阅“[创建包含多个作者的提交或代表某个组织创建提交](/zh/pull-requests/how-tos/commit-changes/creating-a-commit-with-multiple-authors)”。

8. 在提交消息字段下面，确定是要将提交添加到当前分支还是新分支。 如果当前分支是默认分支，则应选择为提交创建新分支，然后创建拉取请求。 有关详细信息，请参阅“[创建拉取请求](/zh/pull-requests/how-tos/create-pull-requests/creating-a-pull-request)”。

   ![GitHub 拉取请求的屏幕截图，其中显示了一个单选按钮，用于直接提交到主分支或创建新分支。 已选择“新建分支”。](/assets/images/help/repository/choose-commit-branch.png)

9. 单击“提交更改”或“建议更改” 。

